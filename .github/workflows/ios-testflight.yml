# Builds the iPhone app on a GitHub Mac and uploads it to TestFlight.
# Runs on every push to the native-app branch, or by hand from the Actions tab.
# Needs three repository secrets from App Store Connect: ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY.
name: iPhone build to TestFlight

on:
  push:
    branches: [native-app]
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: true

env:
  APPLE_TEAM_ID: "XULH5PTUYW"

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check setup
        id: ready
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER" ] || [ -z "$KEY" ] || [ "$APPLE_TEAM_ID" = "SET_TEAM_ID" ]; then
            echo "::notice::Skipping upload: App Store Connect secrets or Team ID not set yet."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'true'

      - uses: actions/setup-node@v4
        if: steps.ready.outputs.go == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Build app files
        if: steps.ready.outputs.go == 'true'
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Save upload key
        if: steps.ready.outputs.go == 'true'
        env:
          KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/AuthKey.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST

      - name: Check the App Store Connect key with Apple
        if: steps.ready.outputs.go == 'true'
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          pip3 install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || pip3 install --quiet pyjwt cryptography
          python3 - <<'PY'
          import os, time, json, urllib.request, jwt
          key = open(os.environ["RUNNER_TEMP"] + "/AuthKey.p8").read()
          if "BEGIN PRIVATE KEY" not in key or "END PRIVATE KEY" not in key:
              print("::error::ASC_PRIVATE_KEY does not look like the full .p8 file (BEGIN/END lines missing)."); raise SystemExit(1)
          try:
              tok = jwt.encode({"iss": os.environ["ISSUER"], "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": os.environ["KEY_ID"]})
          except Exception as e:
              print("::error::The .p8 key could not be read: " + str(e)[:200]); raise SystemExit(1)
          def get(path):
              r = urllib.request.Request("https://api.appstoreconnect.apple.com" + path, headers={"Authorization": "Bearer " + tok})
              try:
                  return json.load(urllib.request.urlopen(r))
              except urllib.error.HTTPError as e:
                  print("::error::Apple rejected the key (HTTP %s): %s" % (e.code, e.read().decode()[:300])); raise SystemExit(1)
          ids = get("/v1/bundleIds?filter[identifier]=com.anxiousblackgirls.app")["data"]
          apps = get("/v1/apps?filter[bundleId]=com.anxiousblackgirls.app")["data"]
          certs = get("/v1/certificates?limit=50")["data"]
          print("::notice::Apple accepted the key. Bundle ID registered: %s. App record: %s. Certificates on the team: %d." % (bool(ids), bool(apps), len(certs)))
          PY

      - name: Build, sign, and upload to TestFlight
        if: steps.ready.outputs.go == 'true'
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/AuthKey.p8 -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER"
          report() {
            echo "::error::$1 failed. Errors from Xcode:"
            grep -E "error:|error |Error Domain|No profiles|No signing|certificate|provisioning profile|requires a development team|ITMS-|Failed|exportArchive" "$2" | grep -v "^\s*$" | sort -u | head -20 | while IFS= read -r line; do echo "::error::${line:0:400}"; done
            tail -15 "$2" | while IFS= read -r line; do echo "::warning::${line:0:400}"; done
            exit 65
          }
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee "$RUNNER_TEMP/archive.log" > /dev/null || report "Archive" "$RUNNER_TEMP/archive.log"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            $AUTH 2>&1 | tee "$RUNNER_TEMP/export.log" > /dev/null || report "Upload" "$RUNNER_TEMP/export.log"
          echo "::notice::Build ${{ github.run_number }} uploaded. It appears in TestFlight after Apple finishes processing (usually 10 to 30 minutes)."

      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
